{% extends "base.html" %}

{% block title %}
Login | SarvaHConn
{% endblock %}

{% block content %}

<div class="auth-wrapper">

    <div class="auth-card">

        <div class="text-center mb-4">

            <div class="auth-icon">
                <i class="bi bi-shield-lock-fill"></i>
            </div>

            <h2 class="fw-bold mt-3">
                Welcome Back
            </h2>

            <p class="text-muted">
                Sign in to SarvaHConn
            </p>

        </div>


        <form method="post">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    Username or Email
                </label>

                {{ form.username }}

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                {{ form.password }}

            </div>


            <button
                type="submit"
                class="btn btn-primary w-100 py-2"
            >
                <i class="bi bi-box-arrow-in-right me-2"></i>
                Login
            </button>

        </form>


        <div class="text-center mt-4">

            <p class="mb-0 text-muted">
                Don't have an account?
                <a href="{% url 'register' %}">
                    Register
                </a>
            </p>

        </div>

    </div>

</div>

{% endblock %}
